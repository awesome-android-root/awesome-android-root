name: Traffic stats

on:
  schedule:
    - cron: "0 0 * * 1" # end of Sunday, 00:00 UTC Monday
  workflow_dispatch:

permissions: {}

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          sparse-checkout: scripts
      - name: Update gist
        run: python scripts/traffic.py
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          REPO: ${{ github.repository }}