name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install
      - name: Check internal links
        run: bun run check:links

  build:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: [links]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install

      - name: Typecheck all environments with Bun
        run: bun run typecheck

      - name: Test custom code with Bun
        run: bun run test

      - name: Lint entries
        run: bun run lint:entries

      - name: Build documentation
        run: bun run docs:build

      # ubuntu-latest includes Google Chrome. puppeteer-core uses that binary;
      # do not download Chromium or install its OS packages for this smoke test.
      - name: Smoke-test built search in installed Chrome
        run: bun run test:search

      # Deploy the validated workspace directly. A second runner and artifact
      # upload/download only repeated checkout/runtime/cache setup.
      - name: Deploy to Cloudflare Pages
        if: >-
          success() &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: >-
            pages deploy docs/.vitepress/dist
            --project-name=awesome-android-root
            --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
            --commit-dirty=true
