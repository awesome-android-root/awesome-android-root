name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Parallel, independent checks (item 1 from issue #188) ---

  links:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pure stdlib Python, no Node dependencies needed.
      - name: Check internal links
        run: python3 scripts/check_links.py

  lint:
    name: Lint entries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Regenerates the app index and reports entry lint problems, and does
      # not block the PR (the build regenerates the index anyway, so staleness
      # cannot leak into the site). The outstanding lint issues are pre-existing
      # curation debt. Flip to blocking once cleaned.
      - name: Lint entries and build app index
        continue-on-error: true
        run: bun run index:build

  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # lastUpdated needs the full history
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        run: bun run docs:build

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: docs/.vitepress/dist
          retention-days: 1

  # --- Deploy the CI-built site to Cloudflare Pages (Direct Upload) ---

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=awesome-android-root --branch=main

  # Optional: per-PR preview deployments. Uncomment to enable.
  # deploy-preview:
  #   needs: build
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
